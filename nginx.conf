server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward /api/* requests to the backend container
    # Backend is reachable via Docker network using service name "backend"
    location /api/ {
        proxy_pass http://backend:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large uploads for receipt images (up to 15MB)
        client_max_body_size 15m;

        # Longer timeout for OCR processing (up to 60 seconds)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # For SPA routing (Wouter/React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
